spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TradingDeskPool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always

logging:
  pattern:
    console: "%d{ISO8601} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.trading: INFO
    org.hibernate.SQL: WARN
