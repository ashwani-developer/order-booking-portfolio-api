sonar.projectKey=ashwani-developer_order-booking-portfolio-api
sonar.organization=ashwani-developer
sonar.projectName=Order Booking & Portfolio API

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Coverage
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (generated/config files)
sonar.exclusions=**/dto/**,**/model/Side.java,**/model/OrderState.java,**/model/RiskFlag.java
